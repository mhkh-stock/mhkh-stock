<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Good afternoon 👋 from Pakistan">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36D1DC"/>
      <stop offset="100%" stop-color="#5B86E5"/>
    </linearGradient>
  </defs>
  <rect width="880" height="200" rx="16" fill="url(#sky)"/>

  <g fill="#FFFFFF" opacity="0.85">
    <g>
      <ellipse cx="330" cy="52" rx="52" ry="16"/>
      <ellipse cx="360" cy="44" rx="40" ry="14"/>
      <animateTransform attributeName="transform" type="translate"
        values="-12 0; 12 0; -12 0" dur="26s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="640" cy="150" rx="60" ry="15"/>
      <ellipse cx="672" cy="142" rx="44" ry="13"/>
      <animateTransform attributeName="transform" type="translate"
        values="10 0; -10 0; 10 0" dur="32s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="110" cy="62" r="50" fill="#FFF9C4" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="62" r="34" fill="#FFF176">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="470" y="98" font-size="46" font-weight="700" fill="#FFFFFF" opacity="1">
      Good afternoon 👋
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    </text>
    <text x="470" y="140" font-size="19" font-weight="600" fill="#EAF6FF" opacity="1">
      Nowshera, Pakistan · PKT
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
    </text>
  </g>
</svg>
